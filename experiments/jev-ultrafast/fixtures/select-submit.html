<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Order preferences</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 8px 0; }
  #cover-wrap { position: relative; display: inline-block; margin-top: 12px; }
  #cover { position: absolute; inset: 0; background: rgba(255,255,255,0.01); }
  #status { margin-top: 16px; font-weight: bold; }
</style>
</head>
<body>
<h1>Order preferences</h1>
<label>Shipping speed
  <select id="ship">
    <option value="standard" selected>Standard (5 days)</option>
    <option value="express">Express (2 days)</option>
    <option value="courier">Courier (same day)</option>
    <option value="drone" disabled>Drone (unavailable)</option>
    <optgroup label="Premium" disabled>
      <option value="priority">Priority same-day</option>
    </optgroup>
  </select>
</label>
<label>Gift note <input id="note" type="text" autocomplete="off"></label>
<div>
  <button id="submit">Submit preferences</button>
  <button id="cancel" disabled>Cancel order</button>
</div>
<div id="cover-wrap">
  <button id="support">Priority support</button>
  <div id="cover" title="display cover"></div>
</div>
<p id="status" role="status"></p>
<script>
window.__trial = { expected: "courier", submitted: false, value: null, complete: false, errors: [], log: [] };
const t = window.__trial;
const status = document.getElementById("status");
document.getElementById("ship").addEventListener("change", e =>
  t.log.push({ type: "select", value: e.target.value }));
document.getElementById("submit").addEventListener("click", () => {
  const v = document.getElementById("ship").value;
  t.value = v;
  t.log.push({ type: "submit", value: v });
  if (v === t.expected) {
    t.submitted = true;
    t.complete = true;
    status.textContent = "Preferences submitted: Courier (same day)";
  } else {
    t.errors.push({ type: "bad_submit", value: v });
    status.textContent = "Wrong speed selected: " + v;
  }
});
document.getElementById("cover").addEventListener("click", () =>
  t.errors.push({ type: "cover_clicked" }));
document.getElementById("support").addEventListener("click", () =>
  t.errors.push({ type: "covered_clicked" }));
</script>
</body>
</html>
